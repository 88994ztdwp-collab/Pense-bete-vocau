<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pense-bête vocaux</title>
<meta name="description" content="Mémos vocaux installables : enregistrez, classez par catégorie, ajoutez une échéance. Fonctionne hors-ligne.">
<meta name="theme-color" content="#0ea5e9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <h1>🎙️ Pense-bête vocaux</h1>
  <div class="topbar-actions">
    <button id="notify-btn" title="Activer les rappels d'échéance">🔔</button>
    <button id="install-btn" hidden>📲 Installer</button>
  </div>
</header>
<div id="insecure-warning" class="warning" hidden>
  Le micro nécessite une connexion sécurisée (HTTPS). Ouvrez l'app via son URL <strong>https://</strong>.
</div>
<main>
  <section class="card recorder">
    <div class="recorder-row">
      <button id="record-btn" class="record" disabled>● Enregistrer</button>
      <span id="record-status" class="status">Prêt</span>
    </div>
    <textarea id="note-text" rows="3" placeholder="Parlez… la transcription apparaît ici (ou tapez votre note)."></textarea>
    <div class="form-row">
      <label>Catégorie
        <select id="note-category"></select>
      </label>
      <button id="new-category-btn" title="Nouvelle catégorie">＋</button>
    </div>
    <div class="form-row">
      <label>Échéance (optionnel)
        <input type="datetime-local" id="note-due">
      </label>
    </div>
    <div class="actions">
      <button id="save-btn" class="primary">💾 Enregistrer la note</button>
      <button id="read-btn">🔊 Lire à voix haute</button>
    </div>
  </section>

  <section class="filters">
    <input type="search" id="search" placeholder="🔍 Rechercher…">
    <div id="category-chips" class="chips"></div>
    <select id="status-filter">
      <option value="all">Toutes</option>
      <option value="todo">À faire</option>
      <option value="overdue">En retard</option>
      <option value="done">Terminées</option>
    </select>
  </section>

  <section>
    <div class="list-header">
      <h2>Mes notes</h2>
      <div class="list-actions">
        <button id="export-btn">⬇️ Exporter</button>
        <button id="import-btn">⬆️ Importer</button>
        <input type="file" id="import-file" accept="application/json" hidden>
      </div>
    </div>
    <ul id="notes-list" class="notes"></ul>
    <p id="empty-msg">Aucune note pour le moment.</p>
  </section>
</main>
<footer>Installable sur l'écran d'accueil (iOS/Android) · données stockées localement · fonctionne hors-ligne.</footer>
<script src="app.js"></script>
</body>
</html>
